[project]
name = "mediflow"
version = "0.1.0"
description = "Data quality & KPI harmonisation pipeline for multi-system healthcare data"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
