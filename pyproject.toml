[project]
name = "mediflow"
version = "1.0.0"
description = "Data quality and KPI harmonisation pipeline for multi-system healthcare data"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
mediflow = "src.cli:main"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
